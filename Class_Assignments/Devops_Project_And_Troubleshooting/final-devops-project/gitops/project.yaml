# AppProject: limits what the TaskBoard Applications may deploy and where.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: taskboard
  namespace: argocd
spec:
  description: TaskBoard capstone (Session 21)
  sourceRepos:
    - git://host.minikube.internal/taskboard-gitops      # local demo repo (git daemon)
    - https://github.com/Masihh143/Devops-all.git         # personal GitHub repository
    - https://github.com/Masihh143/Devops-all
  destinations:
    - server: https://kubernetes.default.svc
      namespace: taskboard
    - server: https://kubernetes.default.svc
      namespace: taskboard-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
